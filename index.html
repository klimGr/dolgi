<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Наши долги</title>
  <meta name="description" content="Кредитки, кредиты и займы семьи: сколько осталось, когда платить, что гасить первым.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Долги">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-180.png">
  <script>
    // До первого кадра: тема и отступы, чтобы экран сразу стоял на месте и не менял цвет
    (function () {
      var root = document.documentElement, hash = location.hash.slice(1);
      var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
      try {
        var params = new URLSearchParams(hash), theme = JSON.parse(params.get('tgWebAppThemeParams') || 'null');
        if (theme && theme.bg_color) {
          var c = parseInt(theme.bg_color.slice(1), 16);
          root.dataset.theme = (c >> 16) * 0.3 + ((c >> 8) & 255) * 0.59 + (c & 255) * 0.11 < 128 ? 'dark' : 'light';
        }
        var saved = JSON.parse(localStorage.getItem('debts.insets.v1') || 'null');
        if (saved && params.has('tgWebAppFullscreen')) {
          root.style.setProperty('--tg-safe-area-inset-top', saved.t + 'px');
          root.style.setProperty('--tg-content-safe-area-inset-top', saved.c + 'px');
        }
      } catch (e) { /* первый запуск или нет хранилища */ }
      // Приложению на экране телефона Telegram не нужен — не ждём его скрипт
      if (!standalone) document.write('<script src="https://telegram.org/js/telegram-web-app.js" defer><\/script>');
    })();
  </script>
  <link rel="stylesheet" href="styles.css?v=20261108">
</head>
<body>
  <main id="app"></main>
  <nav id="tabbar"></nav>
  <div id="tip" role="tooltip" hidden></div>
  <script src="app.js?v=20261108" defer></script>
</body>
</html>
